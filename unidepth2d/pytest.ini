[pytest]
# Run with the depth_cmp env (has onnx/onnxruntime; under the depth env the export tests skip):
#   %LOCALAPPDATA%\anaconda3\envs\depth_cmp\python.exe -m pytest tests
# Do NOT use the anaconda base env: its pip torch nightly and conda MKL numpy each load
# libiomp5md.dll, and the first np.linalg call after torch is imported aborts the process
# (OMP Error #15).
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    ignore:The pynvml package is deprecated:FutureWarning
